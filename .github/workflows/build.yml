name: Build Telemux

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach mobile assets to, for example v0.1.8"
        required: true
        type: string
      build_android:
        description: "Build and upload Android APK"
        required: true
        default: true
        type: boolean
      build_ios:
        description: "Build and upload iOS IPA with EAS"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: telemux-build-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  server:
    if: github.event_name == 'push'
    name: Build Server CLI
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build standalone server CLI
        run: pnpm run build:server:standalone

      - name: Smoke test server CLI
        run: |
          node dist/telemux-server.mjs --help
          node dist/telemux-server.mjs --version

      - name: Package server CLI
        run: |
          tar -czf dist/telemux-server-node24.tar.gz -C dist telemux-server.mjs
          sha256sum dist/telemux-server-node24.tar.gz > dist/telemux-server-node24.tar.gz.sha256

      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<EOF
          Automated Telemux server build for ${GITHUB_REF_NAME} from commit ${GITHUB_SHA}.

          Assets:
          - telemux-server-node24.tar.gz
          - telemux-server-node24.tar.gz.sha256

          Mobile assets are built only when the manual mobile release workflow is run for this tag.
          EOF

      - name: Publish server release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_TITLE="Telemux ${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            dist/telemux-server-node24.tar.gz \
            dist/telemux-server-node24.tar.gz.sha256 \
            --clobber

  mobile:
    if: github.event_name == 'workflow_dispatch'
    name: Build Mobile Assets
    runs-on: ubuntu-latest
    env:
      CI: "1"
      BUILD_ANDROID: ${{ inputs.build_android }}
      BUILD_IOS: ${{ inputs.build_ios }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        if: inputs.build_android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prebuild Android project
        if: inputs.build_android
        run: pnpm --filter @telemux/client run prebuild:android

      - name: Tune Gradle
        if: inputs.build_android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' apps/client/android/gradle.properties
          if grep -q '^org.gradle.parallel=' apps/client/android/gradle.properties; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=true/' apps/client/android/gradle.properties
          else
            printf '\norg.gradle.parallel=true\n' >> apps/client/android/gradle.properties
          fi
          if grep -q '^networkTimeout=' apps/client/android/gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' apps/client/android/gradle/wrapper/gradle-wrapper.properties
          else
            printf '\nnetworkTimeout=60000\n' >> apps/client/android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build release APK
        if: inputs.build_android
        working-directory: apps/client/android
        env:
          NODE_ENV: production
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        if: inputs.build_android
        run: |
          mkdir -p dist/android
          APK_PATH="$(find apps/client/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No release APK was produced."
            exit 1
          fi
          cp "$APK_PATH" dist/android/telemux-android-release.apk
          sha256sum dist/android/telemux-android-release.apk > dist/android/telemux-android-release.apk.sha256

      - name: Build iOS IPA with EAS
        if: inputs.build_ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured; cannot build iOS IPA."
            exit 1
          fi

          mkdir -p dist/ios
          (
            cd apps/client
            pnpm dlx eas-cli@latest build \
              --platform ios \
              --profile production \
              --non-interactive \
              --wait \
              --json
          ) > dist/eas-ios-build.json

          node <<'NODE'
          const fs = require("node:fs");

          const raw = fs.readFileSync("dist/eas-ios-build.json", "utf8");
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const artifactUrl =
            build?.artifacts?.buildUrl ??
            build?.artifacts?.applicationArchiveUrl ??
            build?.applicationArchiveUrl;

          if (!artifactUrl) {
            console.error("Unable to find iOS artifact URL in EAS build output:");
            console.error(JSON.stringify(parsed, null, 2));
            process.exit(1);
          }

          fs.writeFileSync("dist/eas-ios-build-url.txt", `${artifactUrl}\n`);
          NODE

          curl -fL "$(cat dist/eas-ios-build-url.txt)" -o dist/ios/telemux-ios-release.ipa
          sha256sum dist/ios/telemux-ios-release.ipa > dist/ios/telemux-ios-release.ipa.sha256

      - name: Publish mobile release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE="Telemux ${RELEASE_TAG}"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "Manual Telemux mobile asset build for ${RELEASE_TAG}."
          fi

          ASSETS=()

          if [ -f dist/android/telemux-android-release.apk ]; then
            ASSETS+=(
              dist/android/telemux-android-release.apk
              dist/android/telemux-android-release.apk.sha256
            )
          fi

          if [ -f dist/ios/telemux-ios-release.ipa ]; then
            ASSETS+=(
              dist/ios/telemux-ios-release.ipa
              dist/ios/telemux-ios-release.ipa.sha256
            )
          fi

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No mobile assets were built."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
