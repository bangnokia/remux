name: Build Remux

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: remux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and Server CLI
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build standalone server CLI
        run: npm run build:server:standalone

      - name: Smoke test server CLI
        run: node dist/remux-server.mjs --help

      - name: Package server CLI
        run: |
          tar -czf dist/remux-server-node24.tar.gz -C dist remux-server.mjs
          sha256sum dist/remux-server-node24.tar.gz > dist/remux-server-node24.tar.gz.sha256

      - name: Prebuild Android project
        run: npm --workspace @remux/client run prebuild:android

      - name: Tune Gradle memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' apps/client/android/gradle.properties
          if grep -q '^org.gradle.parallel=' apps/client/android/gradle.properties; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=true/' apps/client/android/gradle.properties
          else
            printf '\norg.gradle.parallel=true\n' >> apps/client/android/gradle.properties
          fi

      - name: Build release APK
        working-directory: apps/client/android
        env:
          NODE_ENV: production
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist/android
          APK_PATH="$(find apps/client/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No release APK was produced."
            exit 1
          fi
          cp "$APK_PATH" dist/android/remux-android-release.apk
          sha256sum dist/android/remux-android-release.apk > dist/android/remux-android-release.apk.sha256

      - name: Write release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cat > dist/release-notes.md <<EOF
          Automated Remux build for ${GITHUB_REF_NAME} from commit ${GITHUB_SHA}.

          Assets:
          - remux-android-release.apk
          - remux-android-release.apk.sha256
          - remux-server-node24.tar.gz
          - remux-server-node24.tar.gz.sha256
          EOF

      - name: Publish release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_TITLE="Remux ${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            dist/android/remux-android-release.apk \
            dist/android/remux-android-release.apk.sha256 \
            dist/remux-server-node24.tar.gz \
            dist/remux-server-node24.tar.gz.sha256 \
            --clobber
